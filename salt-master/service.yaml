# External service for Salt master traffic.
# This publishes the standard publisher and request ports so external minions
# can reach the master when the target platform exposes a service endpoint.
apiVersion: v1
kind: Service
metadata:
  name: salt-master
  namespace: aria-config
spec:
  selector: { app: salt-master }
  type: LoadBalancer
  ports:
    - name: tcp-publisher
      port: 4505
      targetPort: 4505
    - name: tcp-request
      port: 4506
      targetPort: 4506
