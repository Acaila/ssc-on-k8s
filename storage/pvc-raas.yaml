# RaaS persistence PVC.
# This claim is reserved for deployment identity and key data that must survive
# a pod restart, rather than for the whole RaaS runtime tree.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raas-pvc
  namespace: aria-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
