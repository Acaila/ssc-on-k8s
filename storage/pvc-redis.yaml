# Redis data PVC.
# Keep Redis append-only data on its own claim so pod replacement does not wipe
# queue and cache state unexpectedly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: aria-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
