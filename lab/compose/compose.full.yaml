version: "3.9"

services:
  postgres:
    image: docker.io/postgres:15-alpine
    container_name: ssc-postgres
    environment:
      POSTGRES_DB: raas
      POSTGRES_USER: raas
      POSTGRES_PASSWORD: raaspass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - ssc-net
    volumes:
      - ../data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raas -d raas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: ssc-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - ssc-net
    volumes:
      - ../data/redis:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  salt-master:
    image: localhost/ssc-salt-master:3006-lts
    container_name: ssc-salt-master
    ports:
      - "4505:4505"
      - "4506:4506"
    networks:
      - ssc-net
    volumes:
      - ../config/salt:/etc/salt:Z
      - ../artifacts/salt:/srv/salt:Z
      - ../logs/salt:/var/log/salt:Z
      - ../tmp/salt/cache:/var/cache/salt:Z
      - ../tmp/salt/run:/var/run/salt:Z
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/saltstack/salt/salt-master", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  raas:
    image: localhost/ssc-raas:8.18.3
    container_name: ssc-raas
    ports:
      - "4507:4507"
    networks:
      - ssc-net
    environment:
      RAAS_DB_HOST: postgres
      RAAS_DB_NAME: raas
      RAAS_DB_USER: raas
      RAAS_DB_PASS: raaspass
      RAAS_REDIS_HOST: redis
      RAAS_REDIS_PORT: "6379"
    volumes:
      - ../config/raas:/etc/raas:Z,U
      - ../logs/raas:/var/log/raas:Z,U
      - ../data/raas:/var/lib/raas:Z,U
      - ../tmp/raas:/var/cache/raas:Z,U
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      salt-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/saltstack/raas/bin/python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',4507)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  ssc-net:
    external: true