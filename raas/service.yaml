# External service for the RaaS UI and API.
# The service shape is kept generic for Kubernetes platforms that can publish a
# real external endpoint while still fitting local cluster validation flows.
apiVersion: v1
kind: Service
metadata:
  name: raas
  namespace: aria-config
spec:
  selector: { app: raas }
  type: LoadBalancer
  ports:
    - name: api
      port: 443
      targetPort: 443
