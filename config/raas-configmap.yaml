apiVersion: v1
kind: ConfigMap
metadata:
  name: raas-config
  namespace: aria-config
data:
  raas: |
    # Example only. The current validated source for container runtime config is
    # images/files/raas.example plus the RaaS entrypoint logic.
    port: 443
    tls_crt: /etc/pki/raas/certs/localhost.crt
    tls_key: /etc/pki/raas/certs/localhost.key
    sql:
      driver: postgresql
      host: @@DB_HOST@@
      port: 5432
      db: @@DB_NAME@@
      user: @@DB_USER@@
      passwd: @@DB_PASS@@
    redis:
      host: @@REDIS_HOST@@
      port: @@REDIS_PORT@@
