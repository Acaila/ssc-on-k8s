# Optional bootstrap secret for deployment-specific identity values.
# The current manifests consume customer_id and cluster_id from this secret when
# present.
apiVersion: v1
kind: Secret
metadata:
  name: ssc-bootstrap
  namespace: aria-config
type: Opaque
stringData:
  customer_id: "00000000-0000-0000-0000-000000000000"
  cluster_id: "00000000-0000-0000-0000-000000000000"
