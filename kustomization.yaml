# Entry-point kustomization kept intentionally narrow.
# The repo now has a validated Minikube deployment workflow, but the manifests
# are not yet maintained as a single generic end-to-end kustomize bundle across
# all target platforms.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aria-config
resources:
  - namespace.yaml

# The remaining manifests are intentionally left out of the default kustomize
# bundle until the broader Kubernetes packaging story is made consistent across
# the supported platform guides.
